function trDaftar_(p) {
  const wajib = ['name', 'employee_id', 'password', 'plant', 'dept', 'position', 'code'];
  for (var i = 0; i < wajib.length; i++) { const v = String(p[wajib[i]] === undefined ? '' : p[wajib[i]]); if (wajib[i] !== 'password' && (v.trim().length < 1 || v.length > 100)) throw trErr_(400, 'Seluruh kolom pendaftaran wajib diisi.'); }
  if (!TR_DEPTS[p.plant] || TR_DEPTS[p.plant].indexOf(p.dept) < 0 || TR_PERAN.indexOf(p.position) < 0) throw trErr_(400, 'Plant, departemen, atau jabatan tidak sesuai.');
  const pw = String(p.password || '');
  if (!/^[0-9]{4,6}$/.test(pw)) throw trErr_(400, 'PIN harus 4 sampai 6 angka.');
  const nik = String(p.employee_id).trim().toUpperCase();
  if (!/^[A-Z0-9._-]{3,30}$/.test(nik)) throw trErr_(400, 'NIK hanya boleh berisi huruf, angka, titik, garis bawah, dan strip.');
  const kode = String(p.code).trim().toUpperCase();
  const lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    const s = trAll_('sesi').filter(function (x) { return x.kode.toUpperCase() === kode && x.aktif === 'ya'; })[0];
    if (!s) throw trErr_(400, 'Kode training tidak aktif atau tidak dikenal.');
    if (trAll_('peserta').some(function (x) { return x.nik === nik; }) || akunRow_(ensureAkunSheet_(SpreadsheetApp.getActiveSpreadsheet()), nik.toLowerCase())) throw trErr_(409, 'NIK sudah terdaftar. Gunakan halaman Login.');
    const salt = Utilities.getUuid();
    trPut_('peserta', 0, { nik: nik, nama: clean_(String(p.name).trim()), plant: p.plant, dept: p.dept, peran: p.position, salt: salt, hash: hash_(salt, pw), dibuat: trNow_(), aktif: 'ya' });
    trPut_('daftar', 0, { id: trNextId_('daftar'), nik: nik, sesi: s.id, gabung: trNow_(), materi: 'tidak', cert: 'tidak' });
    trAudit_(nik, 'REGISTER', 'Training: ' + s.kode);
  } finally { lock.releaseLock(); }
  return { ok: true, username: nik };
}

function layoutHeader(title,subtitle,action=''){return `<div class="top-h"><div><div class="eyebrow">${/^Selamat datang/.test(title)?"TRAINING OVERVIEW / 2026":title==="Data Peserta"?"PARTICIPANT DATABASE":/Statistik/.test(title)?"SAFETY LEARNING ANALYTICS":"STOP–CALL–WAIT TRAINING"}</div><h1>${E(title)}${/^Selamat datang/.test(title)?' <span style="color:#ff8200">✳</span>':''}</h1><p>${E(subtitle)}</p></div><div class="btn-row">${action}</div></div>`}
function actionButton(label,action,cls=''){return `<button class="btn ${cls}" data-act="${action}">${label}</button>`}
function kpi(title,val,desc,ico='chart'){return `<div class="card kpi"><div class="top"><label>${E(title)}</label><i>${icon(ico,17)}</i></div><strong class="numeric">${E(val)}</strong><small>${E(desc)}</small></div>`}
function progress(value){return `<div class="progress progress-sm"><span style="width:${Math.min(100,Math.max(0,Number(value)||0))}%"></span></div>`}
function radarSvg(pre,post){const cx=225,cy=170,r=110;const angles=[-90,-18,54,126,198].map(x=>x*Math.PI/180),pos=(i,v)=>[cx+Math.cos(angles[i])*r*v/100,cy+Math.sin(angles[i])*r*v/100];
 const poly=v=>v.map((x,i)=>pos(i,x).map(y=>y.toFixed(1)).join(',')).join(' ');
 const grid=[20,40,60,80,100].map(v=>`<polygon points="${poly(Array(5).fill(v))}" fill="${v===100?'#fbfcfe':'none'}" stroke="#e4ebf3" stroke-width="1"/>`).join('');
 const axes=angles.map((a,i)=>{const [x,y]=pos(i,100);const [lx,ly]=pos(i,125);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dfe7ef"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#637389" font-size="12" font-weight="700">${E(DIMENSIONS[i][1])}</text>`}).join('');
 const area=(v,color)=>v?`<polygon points="${poly(v)}" fill="${color}" fill-opacity=".13" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${v.map((n,i)=>{const [x,y]=pos(i,n);return `<circle cx="${x}" cy="${y}" r="3.2" fill="${color}" stroke="white" stroke-width="1.4"/>`}).join('')}`:'';
 return `<svg class="radar-svg" viewBox="0 0 450 330" role="img" aria-label="Radar kompetensi Pre-Test dan Post-Test">${grid}${axes}${area(pre,'#7694c9')}${area(post,'#ff8200')}</svg><div class="radar-legend"><span class="key"><span class="sw" style="background:#7694c9"></span> Pre-Test</span><span class="key"><span class="sw" style="background:#ff8200"></span> Post-Test</span></div>`;
}

async function adminParticipants(root){const {stats:s,rows}=await loadStats();root.innerHTML=`${layoutHeader('Data Peserta',`Monitoring ${rows.length} peserta sesuai filter.`,(IS_ADMIN()?actionButton(icon('download',15)+' Export CSV','export','orange'):''))}${adminFilters()}
 <section class="card section-gap"><div class="card-title"><div><h2>Rekap Peserta</h2><p>Klik baris peserta untuk membuka Individual Report.</p></div><span class="pill blue">${s.total} peserta</span></div><div class="table-scroll"><table><thead><tr><th>Peserta</th><th>Plant / Dept</th><th>Peran</th><th>Sesi</th><th>Pre</th><th>Post</th><th>Gain</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr class="row-click" data-report="${r.enrollment_id}" tabindex="0" title="Buka Individual Report"><td><div class="p-cell"><span class="p-avatar">${E(String(r.name||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase())}</span><div><b>${E(r.name)}</b><br><span class="muted tiny">${E(r.employee_id)}</span></div></div></td><td>${E(r.plant)}<br><span class="muted">${E(r.dept)}</span></td><td><span class="pill orange">${E(r.position)}</span></td><td>${E(r.title)}</td><td>${pillScore(r.pre?.score)}</td><td>${pillScore(r.post?.score)}</td><td><b>${change(r.gain)}</b></td><td>${r.certified?'<span class="pill green">Sertifikat Terbit</span>':r.passed?'<span class="pill blue">Lulus</span>':r.post?'<span class="pill red">Belum Lulus</span>':r.pre?'<span class="pill orange">Sedang Training</span>':'<span class="pill">Belum Mulai</span>'}</td><td>${IS_ADMIN()?`<button class="btn sm" data-resetpin="${E(r.employee_id)}">Reset PIN</button> `:''}${IS_ADMIN()&&r.passed&&!r.certified?`<button class="btn sm orange" data-certify="${r.enrollment_id}">Verifikasi</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="9">Belum ada peserta sesuai filter.</td></tr>'}</tbody></table></div></section>`;}
function pillScore(s){return s==null?'<span class="pill">—</span>':`<span class="pill ${s>=80?'green':s>=60?'orange':'red'}">${pct(s)}</span>`}
async function adminCourses(root){const {courses}=await api('/api/admin/courses');root.innerHTML=`${layoutHeader('Sesi Training','Buat kode training, atur batas kelulusan, dan aktifkan/arsipkan sesi.')}
 <div class="cols-2-1"><section class="card"><div class="card-title"><div><h2>Daftar Sesi Training</h2><p>Kode digunakan untuk pendaftaran peserta baru.</p></div></div><div class="table-scroll"><table style="min-width:580px"><thead><tr><th>Judul</th><th>Kode</th><th>Batas Lulus</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${courses.map(c=>`<tr><td><b>${E(c.title)}</b><br><span class="tiny muted">Dibuat ${date(c.created_at)}</span></td><td><code>${E(c.code||'—')}</code></td><td>${c.pass_mark}%</td><td><span class="pill ${c.active?'green':'red'}">${c.active?'Aktif':'Arsip'}</span></td><td>${IS_ADMIN()?`<button class="btn sm" data-toggle-course="${c.id}" data-toggle-value="${c.active?'0':'1'}">${c.active?'Arsipkan':'Aktifkan'}</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section>
 ${IS_ADMIN()?`<aside class="card"><h2>Buat Training Baru</h2><p class="muted small">Untuk batch lain, buat kode terpisah agar hasil tetap tercatat sesuai sesinya.</p><form id="courseForm" class="section-gap"><div class="field"><label>Nama sesi training</label><input class="input" name="title" required maxlength="120" placeholder="Contoh: SCW Batch November 2026"></div><div class="field section-gap"><label>Minimal nilai kelulusan</label><input class="input" type="number" name="pass_mark" min="0" max="100" value="80" required></div><button class="btn orange section-gap" type="submit">Buat Sesi dan Kode</button></form><div class="hint section-gap">Kode training bersifat akses pendaftaran, bukan pengganti verifikasi identitas karyawan oleh trainer.</div></aside>`:''}</div>`;}
async function adminQuestions(root){const key=`dept=${encodeURIComponent(state.bankDept)}&position=${encodeURIComponent(state.bankPosition)}&phase=${state.bankPhase}`;const {questions}=await api('/api/admin/questions?'+key);state.questionList=questions;

async function adminReports(root){const {stats:s,rows}=await loadStats();root.innerHTML=`${layoutHeader('Statistik & Laporan','Dashboard analitik per kelas dan kompetensi.',(IS_ADMIN()?actionButton(icon('download',15)+' Ekspor CSV','export','orange'):''))}${adminFilters()}${adminSummary(s)}

 <div class="cols-2 section-gap"><section class="card"><div class="card-title"><h2>Perbandingan Plant</h2></div>${s.plant.map(x=>`<div class="stat-row"><span>${E(x.name)} · ${x.count} peserta</span><b>Pre ${pct(x.pre)} → Post ${pct(x.post)}</b></div>`).join('')}</section><section class="card"><div class="card-title"><h2>Departemen</h2></div>${s.departments.map(x=>`<div class="stat-row"><span>${E(x.name)} · ${x.count}</span><b>${pct(x.post)}</b></div>`).join('')}</section></div><div class="hint section-gap">Perlu interpretasi HSE/trainer: perbedaan nilai tidak membuktikan perubahan perilaku lapangan secara otomatis. Gunakan observasi kerja dan tindak lanjut bersama data tes.</div>`;}

function certLaurel(){const P0=[272,318],P1=[168,270],P2=[236,184];const pt=t=>[(1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];const tg=t=>Math.atan2(2*(1-t)*(P1[1]-P0[1])+2*t*(P2[1]-P1[1]),2*(1-t)*(P1[0]-P0[0])+2*t*(P2[0]-P1[0]))*180/Math.PI;
 let s='<path d="M'+P0+' Q'+P1+' '+P2+'" fill="none" stroke="url(#cOg)" stroke-width="3.5" stroke-linecap="round"/>';
 for(let i=0;i<8;i++){const t=.08+i*.118,p=pt(t),a=tg(t),L=40-i*2.4;[-52,52].forEach(d=>{s+='<ellipse cx="'+(L/2)+'" cy="0" rx="'+(L/2)+'" ry="'+(L*.3)+'" transform="translate('+p[0].toFixed(1)+' '+p[1].toFixed(1)+') rotate('+(a+d).toFixed(1)+')" fill="url(#cOg)"/>'})}
 const e=pt(1);s+='<ellipse cx="9" cy="0" rx="10" ry="4.6" transform="translate('+e[0].toFixed(1)+' '+e[1].toFixed(1)+') rotate('+(tg(1)).toFixed(1)+')" fill="url(#cOg)"/>';return s}

function certData(){const r=selectedCourse(),u=state.me;if(!r||!r.certified||!r.cert_code){message('Sertifikat belum diverifikasi trainer.',true);return null}return{name:u.name,nik:u.employee_id,plant:u.plant,dept:u.dept,pos:u.position,title:r.title,score:(r.post&&r.post.score!=null)?r.post.score:'—',pass:r.pass_mark,date:date(r.certified_at),code:r.cert_code}}
function certFile(d,ext){return 'Sertifikat_SCW_'+String(d.nik).replace(/[^A-Za-z0-9_-]/g,'')+'.'+ext}
async function certCanvas(d){const w=3600,h=2400;const url=URL.createObjectURL(new Blob([certSvg(d,[w,h])],{type:'image/svg+xml;charset=utf-8'}));try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('Gambar sertifikat gagal dibuat.'));i.src=url});const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c}finally{URL.revokeObjectURL(url)}}
function certJpegBlob(c){return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Gambar sertifikat gagal dibuat.')),'image/jpeg',.95))}
function certSave(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function certPdf(jpg,pw,ph){const W=841.89,H=561.26,enc=s=>new TextEncoder().encode(s),parts=[],offs=[];let n=0;const put=u=>{parts.push(u);n+=u.length};
 put(new Uint8Array([37,80,68,70,45,49,46,52,10,37,255,255,255,255,10]));
 const obj=(i,head,body)=>{offs[i]=n;put(enc(i+' 0 obj\n'+head));if(body){put(enc('stream\n'));put(body);put(enc('\nendstream'))}put(enc('\nendobj\n'))};
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 obj(4,'<< /Type /XObject /Subtype /Image /Width '+pw+' /Height '+ph+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\n',jpg);
 const cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';obj(5,'<< /Length '+cs.length+' >>\n',enc(cs));
 const x=n;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';t+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';put(enc(t));

async function certificateDownload(kind){const d=certData();if(!d)return;setBusy(true,'Menyiapkan sertifikat…');try{const c=await certCanvas(d),jb=await certJpegBlob(c);if(kind==='jpg')certSave(jb,certFile(d,'jpg'));else certSave(certPdf(new Uint8Array(await jb.arrayBuffer()),c.width,c.height),certFile(d,'pdf'));message(kind==='jpg'?'Sertifikat JPG diunduh.':'Sertifikat PDF diunduh.')}catch(e){message(e.message||'Sertifikat gagal diunduh.',true)}finally{setBusy(false)}}
function certificatePrint(){const d=certData();if(!d)return;const keep=roots.modal.innerHTML;roots.modal.innerHTML='';roots.cert.innerHTML=certSvg(d);window.addEventListener('afterprint',()=>{roots.cert.innerHTML='';roots.modal.innerHTML=keep},{once:true});window.print()}
function certificateView(){const d=certData();if(!d)return;roots.modal.innerHTML='<div class="modal-bg"><div class="modal cert-modal"><div class="btn-row align-right"><button class="btn sm" data-act="close-modal">✕ Tutup</button></div><h2>Sertifikat Anda</h2><div class="cert-preview">'+certSvg(d)+'</div><div class="btn-row section-gap"><button class="btn orange" data-act="cert-pdf">Unduh PDF</button><button class="btn" data-act="cert-jpg">Unduh JPG</button><button class="btn dark" data-act="print-certificate">Cetak</button></div><p class="muted small section-gap">PDF dan JPG berukuran 3600 × 2400 piksel, cukup tajam untuk dicetak.</p></div></div>'}
function formPayload(form){return Object.fromEntries(new FormData(form).entries())}
async function handleForm(event){const form=event.target;if(!form.id)return;event.preventDefault();if(state.busy)return;setBusy(true);
 try{
  if(form.id==='loginForm'){
   busyOn('Memeriksa akun…',1);try{const lr=await post('/api/login',formPayload(form));setSession(lr.session);busyMsg('Memuat data training…');await refreshMe();state.view=homeView();await navigate(state.view);}finally{busyOff()}message(`Selamat datang, ${state.me.name}!`);
  }else if(form.id==='registerForm'){
   const p=formPayload(form);const r=await post('/api/register',p);renderAuth('login');document.querySelector('#loginForm [name=username]').value=r.username;message('Registrasi berhasil. Silakan login menggunakan NIK dan PIN Anda.');
  }else if(form.id==='joinForm'){
   await post('/api/enroll',formPayload(form));await refreshMe();await navigate('overview');message('Berhasil bergabung dengan sesi training.');
  }else if(form.id==='passwordForm'){
   await post('/api/change-password',formPayload(form));form.reset();message(state.me.role==='participant'?'PIN diperbarui.':'Password diperbarui.');
  }else if(form.id==='courseForm'){
   const p=formPayload(form);p.pass_mark=Number(p.pass_mark);const r=await post('/api/admin/courses',p);await refreshMe();await navigate('courses');showModal(`<div class="eyebrow">SESI BERHASIL DIBUAT</div><h2>Kode Training</h2><div style="font-size:28px;font-weight:900;color:#f08000;margin:20px 0">${E(r.code)}</div><p>Bagikan kode hanya kepada calon peserta training. Simpan untuk kebutuhan registrasi.</p>`);
  }else if(form.id==='editQuestionForm'){
   const p=formPayload(form);await api('/api/admin/questions',{method:'PUT',body:JSON.stringify({id:form.dataset.qid,question:p.question,options:[p.option0,p.option1,p.option2,p.option3],correct:Number(p.correct),explanation:p.explanation})});closeModal();await navigate('questions');message('Bank soal diperbarui untuk tes baru.');
  }else if(form.id==='trainerForm'){
   const r=await post('/api/admin/users/create',formPayload(form));showModal(`<h2>Akun Trainer Berhasil Dibuat</h2><p>Username: <b>${E(r.username)}</b></p><p>Password sementara:</p><div style="padding:14px;background:#fff4e7;border:1px solid #ffcd8a;border-radius:12px;font:700 21px ui-monospace,monospace;overflow-wrap:anywhere">${E(r.temp_password)}</div><p class="small muted">Catat sekarang dan sampaikan langsung kepada trainer. Password tidak akan ditampilkan lagi.</p>`);
  }
 }catch(e){message(e.message,true)}finally{setBusy(false)}
}
let event_who='';document.addEventListener('click',e=>{const b=e.target.closest('[data-who]');if(b)event_who=b.dataset.who},true);
async function doAction(act){if(state.busy)return;
 if(['overview','material','pre','post','result','profile','dashboard','participants','courses','questions','reports','settings'].includes(act))return navigate(act);
 if(act==='close-modal')return closeModal();if(act==='reload')return navigate(state.view);
 if(act==='begin-test'){
  setBusy(true);try{const phase=state.view;const r=await post('/api/attempts/start',{course_id:state.courseId,phase});state.assessment={id:r.attempt_id,phase,questions:r.questions};state.questionIndex=0;state.answers=Array(r.questions.length).fill(null);renderQuestion()}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='next-question'||act==='prev-question'){
  if(!state.assessment)return;state.questionIndex=Math.min(state.assessment.questions.length-1,Math.max(0,state.questionIndex+(act==='next-question'?1:-1)));renderQuestion();return;
 }
 if(act==='quiz-submit'){
  const missing=state.answers.findIndex(x=>!Number.isInteger(x));if(missing>=0){state.questionIndex=missing;renderQuestion();message('Masih ada pertanyaan yang belum dijawab.',true);return;}
  if(!confirm('Kumpulkan semua jawaban sekarang? Hasil tidak dapat diubah dan tes tidak dapat diulang.'))return;
  setBusy(true);try{await post('/api/attempts/submit',{attempt_id:state.assessment.id,answers:state.answers});sessionStorage.removeItem(draftKey());state.assessment=null;await refreshMe();await navigate('result');message('Tes berhasil dikumpulkan. Hasil radar diperbarui.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='material-finish'){
  if(!confirm('Saya telah mempelajari materi dan siap melanjutkan ke Post-Test.'))return;
  setBusy(true);try{await post('/api/material-complete',{course_id:state.courseId});await refreshMe();await navigate('post');message('Materi selesai. Silakan memulai Post-Test.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='export'){try{const r=await api('/api/admin/export?'+adminParams());const blob=new Blob([r.csv],{type:'text/csv;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=r.name||'TJForge_SCW_Report.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),3000);message('Laporan CSV berhasil diunduh.')}catch(e){message(e.message,true)}return;}
 if(act==='print-certificate')return certificatePrint();if(act==='view-certificate')return certificateView();if(act==='cert-pdf')return certificateDownload('pdf');if(act==='cert-jpg')return certificateDownload('jpg');
 if(act==='demo-login'){const W={peserta:['DEMO-001','123456'],admin:['demo-admin','DemoAdmin123'],tamu:['demo-tamu','DemoTamu123']}[event_who];setBusy(true);busyOn('Masuk…',1);try{const r=await post('/api/login',{username:W[0],password:W[1]});setSession(r.session);busyMsg('Memuat data training…');await refreshMe();state.view=state.me.role==='participant'?'overview':'dashboard';await navigate(state.view)}catch(e){message(e.message,true)}finally{busyOff();setBusy(false)}return;}
 if(act==='guest-login'){setBusy(true);busyOn('Masuk sebagai tamu…',1);try{const r=await post('/api/login-tamu',{});setSession(r.session);busyMsg('Memuat data training…');await refreshMe();state.view='dashboard';await navigate('dashboard');message('Masuk sebagai tamu (hanya melihat).')}catch(e){message(e.message,true)}finally{busyOff();setBusy(false)}return;}
}
async function logout(){if(!confirm('Keluar dari akun sekarang?'))return;busyOn('Keluar dari akun…',1);try{await post('/api/logout',{});}catch(e){}setSession(null);state.me=null;state.csrf=null;state.assessment=null;renderAuth();busyOff();message('Anda telah keluar dari sistem.');}
function handleSelect(event){const el=event.target,id=el.id;
 if(id==='signupPlant'){document.getElementById('signupDept').innerHTML=optionsHtml(state.meta.plants[el.value]);return}
 if(id==='courseSelect'){state.courseId=Number(el.value);return navigate(state.view)}
 if(id==='adminCourse'){state.adminCourseId=Number(el.value);return navigate(state.view)}
 if(id==='adminPlant'){state.adminPlant=el.value;if(state.adminDept!=='all'&&state.adminPlant!=='all'&&!state.meta.plants[el.value].includes(state.adminDept))state.adminDept='all';return navigate(state.view)}
 if(id==='adminDept'){state.adminDept=el.value;return navigate(state.view)}
 if(id==='adminPosition'){state.adminPosition=el.value;return navigate(state.view)}
 if(id==='matDept'){state.matDept=el.value;return navigate('material')}
 if(id==='bankDept'){state.bankDept=el.value;return navigate('questions')}
 if(id==='bankPosition'){state.bankPosition=el.value;return navigate('questions')}
 if(id==='bankPhase'){state.bankPhase=el.value;return navigate('questions')}
}
document.addEventListener('submit',handleForm);
document.addEventListener('change',handleSelect);
document.addEventListener('click',async(e)=>{
 const auth=e.target.closest('[data-auth]');if(auth)return renderAuth(auth.dataset.auth);
 const nav=e.target.closest('[data-nav]');if(nav)return navigate(nav.dataset.nav);
 const act=e.target.closest('[data-act]');if(act)return doAction(act.dataset.act);
 const a=e.target.closest('[data-answer]');if(a&&state.assessment){state.answers[state.questionIndex]=Number(a.dataset.answer);try{sessionStorage.setItem(draftKey(),JSON.stringify(state.answers))}catch(e){}renderQuestion();return}
 const q=e.target.closest('[data-q]');if(q&&state.assessment){state.questionIndex=Number(q.dataset.q);return renderQuestion()}
 const edit=e.target.closest('[data-edit-question]');if(edit)return questionEdit(Number(edit.dataset.editQuestion));
 const rp=e.target.closest('[data-resetpin]');if(rp){const pin=prompt('PIN baru untuk '+rp.dataset.resetpin+' (4–6 angka):');if(pin===null)return;try{await post('/api/admin/reset-pin',{nik:rp.dataset.resetpin,pin:pin.trim()});message('PIN peserta diatur ulang. Sampaikan PIN baru kepada peserta.')}catch(err){message(err.message,true)}return}
 const cert=e.target.closest('[data-certify]');if(cert){if(!confirm('Verifikasi hasil kelulusan dan terbitkan sertifikat peserta ini?'))return;try{await post('/api/admin/certify',{enrollment_id:Number(cert.dataset.certify)});const _od=document.getElementById('drawerRoot'),_oid=_od&&_od.dataset.id;await navigate('participants');if(_oid)openReport(Number(_oid));message('Sertifikat disetujui dan dapat dicetak peserta.')}catch(e){message(e.message,true)}return}
 const toggle=e.target.closest('[data-toggle-course]');if(toggle){if(!confirm('Ubah status aktif sesi training? Peserta tidak dapat memulai tes pada sesi yang dinonaktifkan.'))return;try{await post('/api/admin/courses/toggle',{id:Number(toggle.dataset.toggleCourse),active:toggle.dataset.toggleValue==='1'});await refreshMe();await navigate('courses');message('Status sesi training diubah.')}catch(e){message(e.message,true)}return;}
 if(e.target.closest('#logoutBtn,[data-logout]'))return logout();if(e.target.closest('#toggleMenu')){state.sidebar=!state.sidebar;document.getElementById('sidebar').classList.toggle('open',state.sidebar);return}
});
