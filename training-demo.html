        .concat(TR_DIMS.map(function (d) { return x.pre && x.pre.dimensions ? x.pre.dimensions[d[0]] : ''; }))
        .concat(TR_DIMS.map(function (d) { return x.post && x.post.dimensions ? x.post.dimensions[d[0]] : ''; }));
      baris.push(r.map(trCsv_).join(','));
    });
    trAudit_(me.user, 'EXPORT_CSV', data.length + ' baris');
    return { csv: '﻿' + baris.join('\r\n'), name: 'TJForge_SCW_Report.csv' };
  }
  throw trErr_(404, 'Endpoint tidak ditemukan.');
}

function trDaftar_(p) {
  const wajib = ['name', 'employee_id', 'password', 'plant', 'dept', 'position', 'code'];
  for (var i = 0; i < wajib.length; i++) { const v = String(p[wajib[i]] === undefined ? '' : p[wajib[i]]); if (wajib[i] !== 'password' && (v.trim().length < 1 || v.length > 100)) throw trErr_(400, 'Seluruh kolom pendaftaran wajib diisi.'); }
  if (!TR_DEPTS[p.plant] || TR_DEPTS[p.plant].indexOf(p.dept) < 0 || TR_PERAN.indexOf(p.position) < 0) throw trErr_(400, 'Plant, departemen, atau jabatan tidak sesuai.');
  const pw = String(p.password || '');
  if (pw.length < 10 || pw.length > 128) throw trErr_(400, 'Password minimal 10 karakter.');
  const nik = String(p.employee_id).trim().toUpperCase();
  if (!/^[A-Z0-9._-]{3,30}$/.test(nik)) throw trErr_(400, 'NIK hanya boleh berisi huruf, angka, titik, garis bawah, dan strip.');
  const kode = String(p.code).trim().toUpperCase();
  const lock = LockService.getScriptLock();
  lock.waitLock(25000);
  try {
    const s = trAll_('sesi').filter(function (x) { return x.kode.toUpperCase() === kode && x.aktif === 'ya'; })[0];
    if (!s) throw trErr_(400, 'Kode training tidak aktif atau tidak dikenal.');
    if (trAll_('peserta').some(function (x) { return x.nik === nik; }) || akunRow_(ensureAkunSheet_(SpreadsheetApp.getActiveSpreadsheet()), nik.toLowerCase())) throw trErr_(409, 'NIK sudah terdaftar. Gunakan halaman Login.');
    const salt = Utilities.getUuid();
    trPut_('peserta', 0, { nik: nik, nama: clean_(String(p.name).trim()), plant: p.plant, dept: p.dept, peran: p.position, salt: salt, hash: hash_(salt, pw), dibuat: trNow_(), aktif: 'ya' });
    trPut_('daftar', 0, { id: trNextId_('daftar'), nik: nik, sesi: s.id, gabung: trNow_(), materi: 'tidak', cert: 'tidak' });
    trAudit_(nik, 'REGISTER', 'Training: ' + s.kode);
  } finally { lock.releaseLock(); }
  return { ok: true, username: nik };
}

.toUpperCase())}</div></div><button class="btn sm" data-logout title="Keluar">${icon('logout',16)}</button></div></header><main class="content" id="content"><div class="card">Memuat data...</div></main></div><nav class="mobile-nav" aria-label="Navigasi">${currentNav.slice(0,5).map(([id,label,ic])=>`<button class="mnav ${state.view===id?'active':''}" data-nav="${id}">${icon(ic,20)}<span>${E(label.replace('Statistik & Laporan','Laporan').replace('Materi Training','Materi').replace('Hasil Peserta','Peserta').replace('Sesi Training','Sesi').replace('Dashboard HSE','Dashboard').replace('Hasil Individu','Hasil'))}</span></button>`).join('')}</nav></div>`;

function layoutHeader(title,subtitle,action=''){return `<div class="top-h"><div><div class="eyebrow">TRAINING OVERVIEW / 2026</div><h1>${E(title)}${/^Selamat datang/.test(title)?' <span style="color:#ff8200">✳</span>':''}</h1><p>${E(subtitle)}</p></div><div class="btn-row">${action}</div></div>`}
function actionButton(label,action,cls=''){return `<button class="btn ${cls}" data-act="${action}">${label}</button>`}
function kpi(title,val,desc,ico='chart'){return `<div class="card kpi"><div class="top"><label>${E(title)}</label><i>${icon(ico,17)}</i></div><strong class="numeric">${E(val)}</strong><small>${E(desc)}</small></div>`}
function progress(value){return `<div class="progress progress-sm"><span style="width:${Math.min(100,Math.max(0,Number(value)||0))}%"></span></div>`}
function radarSvg(pre,post){const cx=225,cy=170,r=110;const angles=[-90,-18,54,126,198].map(x=>x*Math.PI/180),pos=(i,v)=>[cx+Math.cos(angles[i])*r*v/100,cy+Math.sin(angles[i])*r*v/100];
 const poly=v=>v.map((x,i)=>pos(i,x).map(y=>y.toFixed(1)).join(',')).join(' ');
 const grid=[20,40,60,80,100].map(v=>`<polygon points="${poly(Array(5).fill(v))}" fill="${v===100?'#fbfcfe':'none'}" stroke="#e4ebf3" stroke-width="1"/>`).join('');
 const axes=angles.map((a,i)=>{const [x,y]=pos(i,100);const [lx,ly]=pos(i,125);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dfe7ef"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#637389" font-size="12" font-weight="700">${E(DIMENSIONS[i][1])}</text>`}).join('');
 const area=(v,color)=>v?`<polygon points="${poly(v)}" fill="${color}" fill-opacity=".13" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${v.map((n,i)=>{const [x,y]=pos(i,n);return `<circle cx="${x}" cy="${y}" r="3.2" fill="${color}" stroke="white" stroke-width="1.4"/>`}).join('')}`:'';
 return `<svg class="radar-svg" viewBox="0 0 450 330" role="img" aria-label="Radar kompetensi Pre-Test dan Post-Test">${grid}${axes}${area(pre,'#7694c9')}${area(post,'#ff8200')}</svg><div class="radar-legend"><span class="key"><span class="sw" style="background:#7694c9"></span> Pre-Test</span><span class="key"><span class="sw" style="background:#ff8200"></span> Post-Test</span></div>`;
}
function dimsToArr(o){return o?DIMENSIONS.map(([k])=>o[k]??0):null}
function bars(items,key='count',nameKey='name'){if(!items?.length)return `<div class="chart-empty">Belum ada data pada filter ini.</div>`;const max=Math.max(1,...items.map(x=>Number(x[key])||0));return `<div class="bar-chart">${items.map(x=>`<div class="bar-line"><span title="${E(x[nameKey])}">${E(x[nameKey])}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,100*(Number(x[key])||0)/max)}%"></div></div><b>${E(x[key])}</b></div>`).join('')}</div>`}
function userCourses(){const list=state.me.courses||[];return `<select id="courseSelect" class="select select-course">${optionsHtml(courseOptions(),state.courseId)}</select>`}
async function navigate(view){
 state.view=view;state.sidebar=false;renderShell();const content=document.getElementById('content');
 try{
  if(state.me.role==='participant')await renderParticipantView(view,content);
  else await renderAdminView(view,content);
 }catch(e){content.innerHTML=`<div class="card"><h2>Tidak bisa memuat halaman</h2><p class="muted">${E(e.message)}</p>${actionButton('Coba lagi','reload','orange')}</div>`;message(e.message,true)}
 const heading=document.getElementById('topCrumb');if(heading)heading.textContent='STOP · CALL · WAIT / '+({overview:'Dashboard',material:'Materi Pembelajaran',pre:'Pre-Test',post:'Post-Test',result:'Hasil Individu',profile:'Profil Peserta',dashboard:'Dashboard',participants:'Data Peserta',courses:'Sesi Training',questions:'Bank Soal',reports:'Statistik & Laporan',settings:'Pengaturan'})[view]||'Training';
 window.scrollTo({top:0,behavior:'instant'});
}
async function renderParticipantView(view,root){
 if(view==='overview')return participantOverview(root);
 if(view==='material')return participantMaterial(root);
 if(view==='pre'||view==='post')return participantTest(root,view);
 if(view==='result')return participantResults(root);
 if(view==='profile')return participantProfile(root);
 return participantOverview(root);
}

 root.innerHTML=`${layoutHeader('Selamat datang, '+String(state.me.name||'').split(' ')[0],'Perkembangan kompetensi STOP–CALL–WAIT secara individual.',userCourses())}
 <section class="hero"><div><span class="eyebrow" style="color:#ffbd75">BUILDING SAFETY CULTURE</span><h2>Kenali abnormal. Ambil tindakan tepat.</h2><p>Profil: ${E(state.me.name)} · ${E(state.me.plant)} / ${E(state.me.dept)} · ${E(state.me.position)}. Kerjakan Pre-Test, pelajari materi, lalu buktikan peningkatan pada Post-Test.</p>${actionButton(post?'Lihat hasil training':pre?'Lanjut belajar':'Mulai Pre-Test',post?'result':pre?'material':'pre','orange')}</div><div class="banner-symbol"><div class="orb"></div><div class="shield-mark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg></div></div></section>
 ${!c?'<div class="card section-gap"><h2>Anda belum terdaftar pada sesi training.</h2><p>Masukkan kode training dari trainer di menu Profil.</p></div>':`<div class="kpi-grid section-gap">${kpi('Pre-Test',pre?pct(pre.score):'—','Nilai sebelum training','pencil')}${kpi('Post-Test',post?pct(post.score):'—','Nilai setelah training','check')}${kpi('Improvement',change(result.gain),'Selisih nilai berpasangan','trend')}${kpi('Status',post?(result.passed?'Lulus':'Belum Lulus'):pre?'Proses':'Belum Mulai',`Kriteria kelulusan ${c.pass_mark}%`,'shield')}</div><div class="cols-2 section-gap"><section class="card"><div class="card-title"><div><h2>Radar kompetensi</h2><p>Perbandingan lima kompetensi utama</p></div><span class="pill orange">5 dimensi</span></div>${pre?radar:'<div class="chart-empty">Radar akan muncul setelah Pre-Test dikumpulkan.</div>'}</section><section class="card"><div class="card-title"><div><h2>Alur training</h2><p>Berjalan berurutan untuk menjaga validitas asesmen.</p></div></div><div class="timeline"><div class="timeline-item"><div class="timeline-num">01</div><div><h3>Pre-Test ${pre?'✓':''}</h3><p>${pre?`Selesai pada ${date(pre.submitted_at)}. Nilai ${pre.score}%.`:'Ukur pengetahuan sebelum mempelajari materi.'}</p></div></div><div class="timeline-item"><div class="timeline-num">02</div><div><h3>Pelajari materi ${c.material_done?'✓':''}</h3><p>${c.material_done?'Materi telah ditandai selesai.':'Pahami STOP, CALL, WAIT, dan persyaratan restart.'}</p></div></div><div class="timeline-item"><div class="timeline-num">03</div><div><h3>Post-Test ${post?'✓':''}</h3><p>${post?`Selesai. Nilai ${post.score}%.`:'Pertanyaan berbeda sesuai departemen dan peran.'}</p></div></div><div class="timeline-item"><div class="timeline-num">04</div><div><h3>Verifikasi Trainer ${result.certified?'✓':''}</h3><p>${result.certified?'Sertifikat disetujui dan dapat dicetak.':'Sertifikat hanya tersedia jika lulus dan disetujui trainer.'}</p></div></div></div></section></div>`}`;
}
async function participantMaterial(root){

 const m=await api(`/api/material?course_id=${c.course_id}`);
 const caseData=m.scenario?.pre;const p=state.me;

 <div class="hint warn">Materi ini disusun dari prototipe TJForge dan merupakan draft training. Pastikan alur eskalasi, tindakan STOP, standar isolasi, dan persetujuan restart disesuaikan dengan SOP resmi perusahaan.</div>

 <section class="card section-gap"><h2>Sudah menyelesaikan materi?</h2><p class="muted small">Tandai selesai setelah mempelajari keempat langkah, memahami kasus departemen, dan siap mengerjakan Post-Test.</p><div class="btn-row section-gap">${c.material_done?'<span class="pill green">Materi telah selesai</span>':actionButton('Saya sudah mempelajari materi','material-finish','orange')}${actionButton('Buka Post-Test','post')}</div></section>`;

function draftKey(){return `scw_answers:${state.me.id}:${state.courseId}:${state.assessment.phase}:${state.assessment.id}`}
async function participantTest(root,phase){
 const c=selectedCourse();if(!c){root.innerHTML=layoutHeader(phase==='pre'?'Pre-Test':'Post-Test','Belum terdaftar dalam sesi training.');return;}
 const r=await api(`/api/my/assessment?course_id=${c.course_id}&phase=${phase}`);
 if(!r.attempt){
  const blocked=phase==='post'&&(!c.pre?.submitted_at||!c.material_done);
  root.innerHTML=`${layoutHeader(phase==='pre'?'Pre-Test':'Post-Test','15 soal adaptif berdasarkan departemen dan peran.',userCourses())}<div class="cols-2-1"><div class="card"><div class="eyebrow">TRAINING ASSESSMENT</div><h2 style="margin:8px 0 12px">${phase==='pre'?'Ukur pemahaman sebelum training':'Evaluasi pemahaman setelah training'}</h2><p class="muted">Soal terdiri dari 5 prinsip umum, 5 soal tanggung jawab ${E(state.me.position)}, dan 5 kasus departemen ${E(state.me.dept)}. Setiap kompetensi mendapat tiga pertanyaan.</p><div class="stat-row"><span>Jumlah pertanyaan</span><b>15</b></div><div class="stat-row"><span>Plant / Departemen</span><b>${E(state.me.plant)} / ${E(state.me.dept)}</b></div><div class="stat-row"><span>Peran</span><b>${E(state.me.position)}</b></div><div class="stat-row"><span>Percobaan</span><b>1 kali per sesi</b></div><div class="hint warn section-gap">${blocked?'Post-Test dikunci. Selesaikan Pre-Test dan pelajari materi terlebih dahulu.':'Kumpulkan jawaban ketika seluruh soal sudah terisi. Setelah submit, jawaban tidak dapat diubah.'}</div><div class="btn-row section-gap">${blocked?actionButton('Buka Materi','material','orange'):actionButton('Mulai '+(phase==='pre'?'Pre-Test':'Post-Test'),'begin-test','orange')}</div></div><div class="card"><h2>5 kompetensi yang dinilai</h2><div class="timeline section-gap">${DIMENSIONS.map(([k,n],i)=>`<div class="timeline-item"><span class="timeline-num">0${i+1}</span><div><h3>${n}</h3><p>3 soal yang menguji pemahaman dan respons tindakan.</p></div></div>`).join('')}</div></div></div>`;
  return;
 }
 if(r.attempt.completed){root.innerHTML=`${layoutHeader(phase==='pre'?'Pre-Test':'Post-Test','Tes telah diselesaikan.',userCourses())}<div class="card"><div class="pill green">Selesai</div><h2 style="font-size:33px;margin:12px 0">Nilai ${r.attempt.score}%</h2><p class="muted">Tes hanya dapat dikerjakan satu kali. Buka halaman hasil untuk analisis radar dan pembahasan.</p>${actionButton('Lihat hasil','result','orange')}</div>`;return;}
 state.assessment={...r.attempt,phase};
 try{const stored=JSON.parse(sessionStorage.getItem(draftKey()));state.answers=Array.isArray(stored)&&stored.length===r.attempt.questions.length?stored:Array(r.attempt.questions.length).fill(null)}catch(e){state.answers=Array(r.attempt.questions.length).fill(null)}
 state.questionIndex=0;renderQuestion();
}
function renderQuestion(){
 const a=state.assessment;if(!a)return;const q=a.questions[state.questionIndex],root=document.getElementById('content');const done=state.answers.filter(Number.isInteger).length;
 root.innerHTML=`${layoutHeader(a.phase==='pre'?'Pre-Test':'Post-Test',`${E(state.me.dept)} · ${E(state.me.position)} · Soal ${state.questionIndex+1} dari ${a.questions.length}`,`<span class="pill blue">${done}/${a.questions.length} dijawab</span>`)}<div class="cols-2-1"><section class="card"><div class="question-top"><span class="pill orange">${E(nameFor(q.dimension))}</span><span class="small muted">${E(q.source)}</span></div><h2 class="question">${E(q.question)}</h2><div>${q.options.map((text,i)=>`<button class="answer ${state.answers[state.questionIndex]===i?'selected':''}" data-answer="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${E(text)}</span></button>`).join('')}</div><div class="btn-row section-gap" style="justify-content:space-between">${actionButton('← Sebelumnya','prev-question','','')}${state.questionIndex===a.questions.length-1?actionButton('Periksa & Submit','quiz-submit','orange'):actionButton('Berikutnya →','next-question','orange')}</div></section><aside class="card"><div class="card-title"><div><h2>Navigasi Soal</h2><p>Pilih nomor soal untuk berpindah.</p></div><span class="pill">${Math.round(done/a.questions.length*100)}%</span></div>${progress(done/a.questions.length*100)}<div class="q-grid section-gap">${a.questions.map((x,i)=>`<button class="${i===state.questionIndex?'active':''} ${Number.isInteger(state.answers[i])?'done':''}" data-q="${i}">${i+1}</button>`).join('')}</div><div class="hint section-gap">Jawaban sementara disimpan selama sesi browser ini. Jawaban dinilai dan disimpan permanen hanya setelah Anda menekan Submit.</div></aside></div>`;
}

 ${pre?`<div class="kpi-grid">${kpi('Pre-Test',pct(pre.score),'15 soal adaptif','pencil')}${kpi('Post-Test',pct(post?.score),'15 soal adaptif','check')}${kpi('Peningkatan',change(r.gain),'Post dikurangi Pre','trend')}${kpi('Kelulusan',post?(r.passed?'LULUS':'BELUM LULUS'):'PROSES',`Batas nilai ${r.pass_mark}%`,'shield')}</div>

}

function formPayload(form){return Object.fromEntries(new FormData(form).entries())}
async function handleForm(event){const form=event.target;if(!form.id)return;event.preventDefault();if(state.busy)return;setBusy(true);
 try{
  if(form.id==='loginForm'){
   busyOn('Memeriksa akun…',1);try{const lr=await post('/api/login',formPayload(form));setSession(lr.session);busyMsg('Memuat data training…');await refreshMe();state.view=state.me.role==='participant'?'overview':'dashboard';await navigate(state.view);}finally{busyOff()}message(`Selamat datang, ${state.me.name}!`);
  }else if(form.id==='registerForm'){
   const p=formPayload(form);const r=await post('/api/register',p);renderAuth('login');document.querySelector('#loginForm [name=username]').value=r.username;message('Registrasi berhasil. Silakan login menggunakan NIK dan password Anda.');
  }else if(form.id==='joinForm'){
   await post('/api/enroll',formPayload(form));await refreshMe();await navigate('overview');message('Berhasil bergabung dengan sesi training.');
  }else if(form.id==='passwordForm'){
   await post('/api/change-password',formPayload(form));form.reset();message('Password diperbarui.');
  }else if(form.id==='courseForm'){
   const p=formPayload(form);p.pass_mark=Number(p.pass_mark);const r=await post('/api/admin/courses',p);await refreshMe();await navigate('courses');showModal(`<div class="eyebrow">SESI BERHASIL DIBUAT</div><h2>Kode Training</h2><div style="font-size:28px;font-weight:900;color:#f08000;margin:20px 0">${E(r.code)}</div><p>Bagikan kode hanya kepada calon peserta training. Simpan untuk kebutuhan registrasi.</p>`);
  }else if(form.id==='editQuestionForm'){
   const p=formPayload(form);await api('/api/admin/questions',{method:'PUT',body:JSON.stringify({id:form.dataset.qid,question:p.question,options:[p.option0,p.option1,p.option2,p.option3],correct:Number(p.correct),explanation:p.explanation})});closeModal();await navigate('questions');message('Bank soal diperbarui untuk tes baru.');
  }else if(form.id==='trainerForm'){
   const r=await post('/api/admin/users/create',formPayload(form));showModal(`<h2>Akun Trainer Berhasil Dibuat</h2><p>Username: <b>${E(r.username)}</b></p><p>Password sementara:</p><div style="padding:14px;background:#fff4e7;border:1px solid #ffcd8a;border-radius:12px;font:700 21px ui-monospace,monospace;overflow-wrap:anywhere">${E(r.temp_password)}</div><p class="small muted">Catat sekarang dan sampaikan langsung kepada trainer. Password tidak akan ditampilkan lagi.</p>`);
  }
 }catch(e){message(e.message,true)}finally{setBusy(false)}
}

  setBusy(true);try{const phase=state.view;const r=await post('/api/attempts/start',{course_id:state.courseId,phase});state.assessment={id:r.attempt_id,phase,questions:r.questions};state.questionIndex=0;state.answers=Array(r.questions.length).fill(null);renderQuestion()}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='next-question'||act==='prev-question'){
  if(!state.assessment)return;state.questionIndex=Math.min(state.assessment.questions.length-1,Math.max(0,state.questionIndex+(act==='next-question'?1:-1)));renderQuestion();return;
 }
 if(act==='quiz-submit'){
  const missing=state.answers.findIndex(x=>!Number.isInteger(x));if(missing>=0){state.questionIndex=missing;renderQuestion();message('Masih ada pertanyaan yang belum dijawab.',true);return;}
  if(!confirm('Kumpulkan semua jawaban sekarang? Hasil tidak dapat diubah dan tes tidak dapat diulang.'))return;
  setBusy(true);try{await post('/api/attempts/submit',{attempt_id:state.assessment.id,answers:state.answers});sessionStorage.removeItem(draftKey());state.assessment=null;await refreshMe();await navigate('result');message('Tes berhasil dikumpulkan. Hasil radar diperbarui.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='material-finish'){
  if(!confirm('Saya telah mempelajari materi dan siap melanjutkan ke Post-Test.'))return;
  setBusy(true);try{await post('/api/material-complete',{course_id:state.courseId});await refreshMe();await navigate('post');message('Materi selesai. Silakan memulai Post-Test.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='export'){try{const r=await api('/api/admin/export?'+adminParams());const blob=new Blob([r.csv],{type:'text/csv;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=r.name||'TJForge_SCW_Report.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),3000);message('Laporan CSV berhasil diunduh.')}catch(e){message(e.message,true)}return;}
 if(act==='print-certificate')return certificatePrint();
 if(act==='demo-login'){const W={peserta:['DEMO-001','DemoPeserta1'],admin:['demo-admin','DemoAdmin123'],tamu:['demo-tamu','DemoTamu123']}[event_who];setBusy(true);busyOn('Masuk…',1);try{const r=await post('/api/login',{username:W[0],password:W[1]});setSession(r.session);busyMsg('Memuat data training…');await refreshMe();state.view=state.me.role==='participant'?'overview':'dashboard';await navigate(state.view)}catch(e){message(e.message,true)}finally{busyOff();setBusy(false)}return;}
 if(act==='guest-login'){setBusy(true);busyOn('Masuk sebagai tamu…',1);try{const r=await post('/api/login-tamu',{});setSession(r.session);busyMsg('Memuat data training…');await refreshMe();state.view='dashboard';await navigate('dashboard');message('Masuk sebagai tamu (hanya melihat).')}catch(e){message(e.message,true)}finally{busyOff();setBusy(false)}return;}
}
async function logout(){if(!confirm('Keluar dari akun sekarang?'))return;busyOn('Keluar dari akun…',1);try{await post('/api/logout',{});}catch(e){}setSession(null);state.me=null;state.csrf=null;state.assessment=null;renderAuth();busyOff();message('Anda telah keluar dari sistem.');}
function handleSelect(event){const el=event.target,id=el.id;
 if(id==='signupPlant'){document.getElementById('signupDept').innerHTML=optionsHtml(state.meta.plants[el.value]);return}
 if(id==='courseSelect'){state.courseId=Number(el.value);return navigate(state.view)}
 if(id==='adminCourse'){state.adminCourseId=Number(el.value);return navigate(state.view)}
 if(id==='adminPlant'){state.adminPlant=el.value;if(state.adminDept!=='all'&&state.adminPlant!=='all'&&!state.meta.plants[el.value].includes(state.adminDept))state.adminDept='all';return navigate(state.view)}
 if(id==='adminDept'){state.adminDept=el.value;return navigate(state.view)}
 if(id==='adminPosition'){state.adminPosition=el.value;return navigate(state.view)}
 if(id==='matDept'){state.matDept=el.value;return navigate('material')}
 if(id==='bankDept'){state.bankDept=el.value;return navigate('questions')}
 if(id==='bankPosition'){state.bankPosition=el.value;return navigate('questions')}
 if(id==='bankPhase'){state.bankPhase=el.value;return navigate('questions')}
}
document.addEventListener('submit',handleForm);
document.addEventListener('change',handleSelect);
document.addEventListener('click',async(e)=>{
 const auth=e.target.closest('[data-auth]');if(auth)return renderAuth(auth.dataset.auth);
 const nav=e.target.closest('[data-nav]');if(nav)return navigate(nav.dataset.nav);
 const act=e.target.closest('[data-act]');if(act)return doAction(act.dataset.act);
 const a=e.target.closest('[data-answer]');if(a&&state.assessment){state.answers[state.questionIndex]=Number(a.dataset.answer);try{sessionStorage.setItem(draftKey(),JSON.stringify(state.answers))}catch(e){}renderQuestion();return}
 const q=e.target.closest('[data-q]');if(q&&state.assessment){state.questionIndex=Number(q.dataset.q);return renderQuestion()}
 const edit=e.target.closest('[data-edit-question]');if(edit)return questionEdit(Number(edit.dataset.editQuestion));
 const cert=e.target.closest('[data-certify]');if(cert){if(!confirm('Verifikasi hasil kelulusan dan terbitkan sertifikat peserta ini?'))return;try{await post('/api/admin/certify',{enrollment_id:Number(cert.dataset.certify)});await navigate('participants');message('Sertifikat disetujui dan dapat dicetak peserta.')}catch(e){message(e.message,true)}return}
 const toggle=e.target.closest('[data-toggle-course]');if(toggle){if(!confirm('Ubah status aktif sesi training? Peserta tidak dapat memulai tes pada sesi yang dinonaktifkan.'))return;try{await post('/api/admin/courses/toggle',{id:Number(toggle.dataset.toggleCourse),active:toggle.dataset.toggleValue==='1'});await refreshMe();await navigate('courses');message('Status sesi training diubah.')}catch(e){message(e.message,true)}return;}
 if(e.target.closest('#logoutBtn,[data-logout]'))return logout();if(e.target.closest('#toggleMenu')){state.sidebar=!state.sidebar;document.getElementById('sidebar').classList.toggle('open',state.sidebar);return}
});
init();

</script>
</body>
</html>
