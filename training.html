<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzEvx1d2kaI6WHVO8sRnWNAHH2CykAYBZ53rDpwy7nZ6S7iRJkkkmmZZl4qFXd50a9tjw/exec";
let SESSION = null;
</script>
<script>
'use strict';
const state={meta:null,me:null,csrf:null,view:'overview',courseId:0,adminCourseId:0,adminPlant:'all',adminDept:'all',adminPosition:'all',adminSearch:'',bankDept:'Forging',bankPosition:'Operator',bankPhase:'pre',stats:null,assessment:null,questionIndex:0,answers:[],busy:false,sidebar:false};
const roots={root:document.getElementById('root'),toast:document.getElementById('toast'),modal:document.getElementById('modalRoot'),cert:document.getElementById('certPrint')};
const DIMENSIONS=[['detect','Deteksi Abnormal'],['stop','STOP'],['call','CALL'],['wait','WAIT'],['restart','Restart Aman']];
const SVG={home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',book:'<path d="M4 19V5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h14"/>',pencil:'<path d="m15 4 5 5-11 11H4v-5L15 4zm-2 2 5 5"/>',check:'<path d="m4 12 6 6L20 6"/>',chart:'<path d="M3 3v18h18M6 17l5-6 4 3 5-8"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2M17 4a4 4 0 0 1 0 8M22 21v-2a7 7 0 0 0-4-6"/>',layers:'<path d="m12 2 9 6-9 6-9-6 9-6zm-9 11 9 6 9-6M3 18l9 5 9-5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m19 13 2-1-2-1-.7-2 1-2-2-2-2 1-2-.7-1-2h-2l-1 2-2 .7-2-1-2 2 1 2-.7 2-2 1 2 1 .7 2-1 2 2 2 2-1 2 .7 1 2h2l1-2 2-.7 2 1 2-2-1-2z"/>',logout:'<path d="M10 17l5-5-5-5m5 5H3m12-9h5v18h-5"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',shield:'<path d="m12 2 9 4v6c0 5-3 8-9 10-6-2-9-5-9-10V6l9-4zm-4 10 3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 3"/>',plus:'<path d="M12 5v14m-7-7h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',refresh:'<path d="M20 7v-4l-3 3a8 8 0 1 0 3 7"/>',trend:'<path d="m3 17 7-7 4 4 7-8m-5 0h5v5"/>',filter:'<path d="M4 7h16M7 12h10m-7 5h4"/>',award:'<circle cx="12" cy="8" r="5"/><path d="M8 12 6 22l6-3 6 3-2-10"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
const icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SVG[name]||SVG.home}</svg>`;
const E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const fNum=n=>n==null?'—':String(n).replace('.',',');
const pct=n=>n==null?'—':`${fNum(n)}%`;
const change=n=>n==null?'—':`${n>0?'+':''}${fNum(n)} poin`;
const date=s=>s?new Date(s).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Jakarta'}):'—';
const nameFor=d=>DIMENSIONS.find(x=>x[0]===d)?.[1]||d;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function message(s,isError=false){roots.toast.textContent=s;roots.toast.classList.toggle('error',isError);roots.toast.classList.remove('hidden');clearTimeout(message.timer);message.timer=setTimeout(()=>roots.toast.classList.add('hidden'),4100)}
function setBusy(b){state.busy=b;document.body.style.cursor=b?'progress':'';}
async function api(path,options={}){
 const method=(options.method||'GET').toUpperCase();
 const [p,qs]=path.split('?');
 const query=Object.fromEntries(new URLSearchParams(qs||''));
 let body={};if(options.body){try{body=JSON.parse(options.body)}catch(e){body={}}}
 let response,data;
 try{response=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'tr',path:p,method,query,body,session:SESSION})});data=await response.json()}
 catch(e){throw new Error('Server tidak terhubung. Periksa jaringan lalu coba lagi.')}
 if(!data.ok){if(data.code==='AUTH'&&path!=='/api/login'&&path!=='/api/me'){setSession(null);state.me=null;state.csrf=null;renderAuth();}throw new Error(data.error||'Permintaan gagal.')}

function radarSvg(pre,post){const cx=225,cy=170,r=110;const angles=[-90,-18,54,126,198].map(x=>x*Math.PI/180),pos=(i,v)=>[cx+Math.cos(angles[i])*r*v/100,cy+Math.sin(angles[i])*r*v/100];

 window.print();
}
function formPayload(form){return Object.fromEntries(new FormData(form).entries())}
async function handleForm(event){const form=event.target;if(!form.id)return;event.preventDefault();if(state.busy)return;setBusy(true);
 try{
  if(form.id==='loginForm'){
   const lr=await post('/api/login',formPayload(form));setSession(lr.session);await refreshMe();state.view=state.me.role==='participant'?'overview':'dashboard';await navigate(state.view);message(`Selamat datang, ${state.me.name}!`);
  }else if(form.id==='registerForm'){
   const p=formPayload(form);const r=await post('/api/register',p);renderAuth('login');document.querySelector('#loginForm [name=username]').value=r.username;message('Registrasi berhasil. Silakan login menggunakan NIK dan password Anda.');
  }else if(form.id==='joinForm'){
   await post('/api/enroll',formPayload(form));await refreshMe();await navigate('overview');message('Berhasil bergabung dengan sesi training.');
  }else if(form.id==='passwordForm'){
   await post('/api/change-password',formPayload(form));form.reset();message('Password diperbarui.');
  }else if(form.id==='courseForm'){
   const p=formPayload(form);p.pass_mark=Number(p.pass_mark);const r=await post('/api/admin/courses',p);await refreshMe();await navigate('courses');showModal(`<div class="eyebrow">SESI BERHASIL DIBUAT</div><h2>Kode Training</h2><div style="font-size:28px;font-weight:900;color:#f08000;margin:20px 0">${E(r.code)}</div><p>Bagikan kode hanya kepada calon peserta training. Simpan untuk kebutuhan registrasi.</p>`);
  }else if(form.id==='editQuestionForm'){
   const p=formPayload(form);await api('/api/admin/questions',{method:'PUT',body:JSON.stringify({id:form.dataset.qid,question:p.question,options:[p.option0,p.option1,p.option2,p.option3],correct:Number(p.correct),explanation:p.explanation})});closeModal();await navigate('questions');message('Bank soal diperbarui untuk tes baru.');
  }else if(form.id==='trainerForm'){
   const r=await post('/api/admin/users/create',formPayload(form));showModal(`<h2>Akun Trainer Berhasil Dibuat</h2><p>Username: <b>${E(r.username)}</b></p><p>Password sementara:</p><div style="padding:14px;background:#fff4e7;border:1px solid #ffcd8a;border-radius:12px;font:700 21px ui-monospace,monospace;overflow-wrap:anywhere">${E(r.temp_password)}</div><p class="small muted">Catat sekarang dan sampaikan langsung kepada trainer. Password tidak akan ditampilkan lagi.</p>`);
  }
 }catch(e){message(e.message,true)}finally{setBusy(false)}
}
async function doAction(act){if(state.busy)return;
 if(['overview','material','pre','post','result','profile','dashboard','participants','courses','questions','reports','settings'].includes(act))return navigate(act);
 if(act==='close-modal')return closeModal();if(act==='reload')return navigate(state.view);
 if(act==='begin-test'){
  setBusy(true);try{const phase=state.view;const r=await post('/api/attempts/start',{course_id:state.courseId,phase});state.assessment={id:r.attempt_id,phase,questions:r.questions};state.questionIndex=0;state.answers=Array(r.questions.length).fill(null);renderQuestion()}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='next-question'||act==='prev-question'){
  if(!state.assessment)return;state.questionIndex=Math.min(state.assessment.questions.length-1,Math.max(0,state.questionIndex+(act==='next-question'?1:-1)));renderQuestion();return;
 }
 if(act==='quiz-submit'){
  const missing=state.answers.findIndex(x=>!Number.isInteger(x));if(missing>=0){state.questionIndex=missing;renderQuestion();message('Masih ada pertanyaan yang belum dijawab.',true);return;}
  if(!confirm('Kumpulkan semua jawaban sekarang? Hasil tidak dapat diubah dan tes tidak dapat diulang.'))return;
  setBusy(true);try{await post('/api/attempts/submit',{attempt_id:state.assessment.id,answers:state.answers});sessionStorage.removeItem(draftKey());state.assessment=null;await refreshMe();await navigate('result');message('Tes berhasil dikumpulkan. Hasil radar diperbarui.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='material-finish'){
  if(!confirm('Saya telah mempelajari materi dan siap melanjutkan ke Post-Test.'))return;
  setBusy(true);try{await post('/api/material-complete',{course_id:state.courseId});await refreshMe();await navigate('post');message('Materi selesai. Silakan memulai Post-Test.')}catch(e){message(e.message,true)}finally{setBusy(false)}return;
 }
 if(act==='export'){try{const r=await api('/api/admin/export?'+adminParams());const blob=new Blob([r.csv],{type:'text/csv;charset=utf-8'});const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=r.name||'TJForge_SCW_Report.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),3000);message('Laporan CSV berhasil diunduh.')}catch(e){message(e.message,true)}return;}
 if(act==='print-certificate')return certificatePrint();
 if(act==='guest-login'){setBusy(true);try{const r=await post('/api/login-tamu',{});setSession(r.session);await refreshMe();state.view='dashboard';await navigate('dashboard');message('Masuk sebagai tamu (hanya melihat).')}catch(e){message(e.message,true)}finally{setBusy(false)}return;}
}
async function logout(){if(!confirm('Keluar dari akun sekarang?'))return;try{await post('/api/logout',{});}catch(e){}setSession(null);state.me=null;state.csrf=null;state.assessment=null;renderAuth();message('Anda telah keluar dari sistem.');}
function handleSelect(event){const el=event.target,id=el.id;
 if(id==='signupPlant'){document.getElementById('signupDept').innerHTML=optionsHtml(state.meta.plants[el.value]);return}
 if(id==='courseSelect'){state.courseId=Number(el.value);return navigate(state.view)}
 if(id==='adminCourse'){state.adminCourseId=Number(el.value);return navigate(state.view)}
 if(id==='adminPlant'){state.adminPlant=el.value;if(state.adminDept!=='all'&&state.adminPlant!=='all'&&!state.meta.plants[el.value].includes(state.adminDept))state.adminDept='all';return navigate(state.view)}
 if(id==='adminDept'){state.adminDept=el.value;return navigate(state.view)}
 if(id==='adminPosition'){state.adminPosition=el.value;return navigate(state.view)}
 if(id==='matDept'){state.matDept=el.value;return navigate('material')}
 if(id==='bankDept'){state.bankDept=el.value;return navigate('questions')}
 if(id==='bankPosition'){state.bankPosition=el.value;return navigate('questions')}
 if(id==='bankPhase'){state.bankPhase=el.value;return navigate('questions')}
}
document.addEventListener('submit',handleForm);
document.addEventListener('change',handleSelect);
document.addEventListener('click',async(e)=>{
 const auth=e.target.closest('[data-auth]');if(auth)return renderAuth(auth.dataset.auth);
 const nav=e.target.closest('[data-nav]');if(nav)return navigate(nav.dataset.nav);
 const act=e.target.closest('[data-act]');if(act)return doAction(act.dataset.act);
 const a=e.target.closest('[data-answer]');if(a&&state.assessment){state.answers[state.questionIndex]=Number(a.dataset.answer);try{sessionStorage.setItem(draftKey(),JSON.stringify(state.answers))}catch(e){}renderQuestion();return}
 const q=e.target.closest('[data-q]');if(q&&state.assessment){state.questionIndex=Number(q.dataset.q);return renderQuestion()}
 const edit=e.target.closest('[data-edit-question]');if(edit)return questionEdit(Number(edit.dataset.editQuestion));
 const cert=e.target.closest('[data-certify]');if(cert){if(!confirm('Verifikasi hasil kelulusan dan terbitkan sertifikat peserta ini?'))return;try{await post('/api/admin/certify',{enrollment_id:Number(cert.dataset.certify)});await navigate('participants');message('Sertifikat disetujui dan dapat dicetak peserta.')}catch(e){message(e.message,true)}return}
 const toggle=e.target.closest('[data-toggle-course]');if(toggle){if(!confirm('Ubah status aktif sesi training? Peserta tidak dapat memulai tes pada sesi yang dinonaktifkan.'))return;try{await post('/api/admin/courses/toggle',{id:Number(toggle.dataset.toggleCourse),active:toggle.dataset.toggleValue==='1'});await refreshMe();await navigate('courses');message('Status sesi training diubah.')}catch(e){message(e.message,true)}return;}
 if(e.target.closest('#logoutBtn'))return logout();if(e.target.closest('#toggleMenu')){state.sidebar=!state.sidebar;document.getElementById('sidebar').classList.toggle('open',state.sidebar);return}
});
init();

</script>
</body>
</html>
